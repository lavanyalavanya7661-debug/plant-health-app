name: plant_health_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  image: ^4.12.0
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  http: ^1.2.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/plant_disease_model.tflite
    - assets/data/plant_disease_labels.json

dependency_overrides:
  path_provider_foundation: 2.4.1